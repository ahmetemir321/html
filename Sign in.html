<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
</head>

<style>
.container{
    display: flex;
    justify-self: center;
    width: 220px;
    height: 330px;
    background-color: rgba(4, 2, 18, 0.271);
    color: rgb(255, 255, 255);
    margin: 20px;
    border-radius: 80px;
    opacity: 50%;
    margin-top: 160px;
}

.center{
    text-align: center;
}

form{
    margin: auto;
    padding: auto;
    font: 15px;
    width: 300px;
}

input{
    margin: 5px;
    padding: auto;
    border-radius: 5px;
    border: none;
    height: 15px;

}

div:hover{
  width: 420px;
}

div{
  width: 420px;
  height: 300px;
  background-color: red;
  transition: width 2s;
}

.background{
    background-image: url(https://i.pinimg.com/1200x/89/b7/b5/89b7b5da553719634ea0673f08e8eedc.jpg);
    background-size: cover;
}

</style>
<body class="background">
<div class="container center">
    <form action="login.html" method="post">
        <h1 style="color: rgb(255, 255, 255);" style="margin: 20px;">Sign in</h1>
        <label for = "username">Username</label>
        <input style="width: 200px;" type="text" id="Username" name="Username" required> <br>
        <label for = "Password">Password</label>
        <a style="color: rgb(159, 159, 159);" class="label-link position-absolute top-0 right-0" id="forgot-password" href="/password_reset">Forgot password?</a> 
        <input style="width: 200px;" type="Password" id="Password" name="Password" required> <br> 
        <input type="submit" id="Sign in" name="Login" value="Sign in"> <br>
        <p>New to Here?</p> <a style="color: rgb(159, 159, 159);" href="sign up.html">Sign up</a>
        
    </form>
</div>

</body>
</html>
